<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Income Statement</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td { padding: 0.2rem 0; }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .heading td { font-weight: 600; padding-top: 1rem; text-align: left; }
    .account td:first-child { padding-left: 1.5rem; }
    .subtotal td { font-weight: 600; border-top: 1px solid #999; }
    .net td { font-weight: 700; border-top: 3px double #000; }
    .error { color: #b00; }
  </style>
</head>
<body>
  <form id="form">
    <label>Start <input type="date" name="start" value="2026-01-01" required></label>
    <label>End <input type="date" name="end" value="2026-03-31" required></label>
    <button>Show</button>
  </form>
  <div id="out"></div>
  <script>
    const form = document.getElementById('form');
    const out = document.getElementById('out');

    // "-1234.50" -> "($1,234.50)". Intl formats the decimal string exactly; it is never parsed into a float.
    const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', currencySign: 'accounting' });

    // table rows: a section title, or a label with an amount
    const heading = (title) => `<tr class="heading"><td colspan="2">${title}</td></tr>`;
    const row = (cls, label, amount) => `<tr class="${cls}"><td>${label}</td><td>${usd.format(amount)}</td></tr>`;
    const section = (title, s, totalLabel) => heading(title)
      + s.lines.map((line) => row('account', `${line.account} ${line.name}`, line.amount)).join('')
      + row('subtotal', totalLabel, s.total);

    async function load() {
      const start = form.elements.start.value;
      const end = form.elements.end.value;
      const res = await fetch(`/income-statement?start=${start}&end=${end}`);
      const s = await res.json();
      if (!res.ok) {
        out.innerHTML = `<p class="error">${s.error}</p>`;
        return;
      }
      out.innerHTML = `<h2>${s.company}</h2><p>Income statement, ${s.start} to ${s.end} (${s.currency})</p><table>`
        + section('Revenue', s.revenue, 'Total revenue')
        + section('Cost of goods sold', s.cost_of_goods_sold, 'Total cost of goods sold')
        + row('subtotal', 'Gross profit', s.gross_profit)
        + section('Operating expenses', s.operating_expenses, 'Total operating expenses')
        + row('subtotal', 'Operating income', s.operating_income)
        + section('Other income', s.other_income, 'Total other income')
        + row('net', 'Net income', s.net_income)
        + '</table>';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      load();
    });
    load();
  </script>
</body>
</html>
